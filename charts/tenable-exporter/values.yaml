# Default values for tenable-exporter.

replicaCount: 1

image:
  repository: ghcr.io/polarpoint-io/tenable-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9190"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tenable:
  # Tenable.io API access key — set directly or reference an existing Secret.
  accessKey: ""
  # Tenable.io API secret key — set directly or reference an existing Secret.
  secretKey: ""

  # Name of an existing Secret containing Tenable credentials.
  # The Secret must have keys `access-key` and `secret-key`.
  # If set, tenable.accessKey and tenable.secretKey above are ignored.
  existingSecret: ""

  # Seconds between full Tenable API scrapes. Minimum 300 recommended
  # (compliance exports are large).
  scrapeInterval: 300

  # Optional: restrict collection to specific cloud providers.
  # Comma-separated list of: aws, azure, gcp
  # Leave empty to include all providers.
  filterProviders: ""

  # Optional: restrict collection to specific subscription / account / project IDs.
  # Comma-separated list of IDs.
  # Leave empty to include all subscriptions.
  filterSubscriptions: ""

  # Set false to skip compliance export collection (large API job).
  complianceEnabled: true

  # Optional compliance export queue timeout in seconds.
  complianceExportTimeout: ""

service:
  type: ClusterIP
  port: 9190

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10

readinessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables injected into the container.
extraEnv: []

# Extra volumes / volume mounts.
extraVolumes: []
extraVolumeMounts: []
