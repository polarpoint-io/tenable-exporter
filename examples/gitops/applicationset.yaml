# ArgoCD ApplicationSet — tenable-exporter multi-cluster deployment
#
# Architecture rationale: docs/architecture.md (sections 2, 3, 5, 6, 7)
# PRD: docs/prd.md
#
# Usage:
#   kubectl apply -f applicationset.yaml -n argocd
#
# To add a new cluster:
#   1. Add an entry to spec.generators[0].list.elements
#   2. Open a PR — ArgoCD deploys on merge
#   No other changes required.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenable-exporter
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # arch doc section 2: list generator — one entry per cluster
          # arch doc section 3: scrapeInterval 300s prod (Tenable API rate limit), 60s dev
          # arch doc section 7: filterProviders per cluster
          - cluster: prod-aws-eu-west-1
            env: prod
            scrapeInterval: "300"
            filterProviders: "aws,azure"
          - cluster: prod-azure-uksouth
            env: prod
            scrapeInterval: "300"
            filterProviders: "azure"
          - cluster: dev-aws-eu-west-1
            env: dev
            scrapeInterval: "60"
            filterProviders: "aws"
  template:
    metadata:
      name: 'tenable-exporter-{{cluster}}'
      labels:
        app.kubernetes.io/name: tenable-exporter
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform
      source:
        # arch doc section 1: upstream OCI chart, pinned version — do not use latest
        repoURL: ghcr.io/polarpoint-io/charts
        targetRevision: 1.1.3
        chart: tenable-exporter
        helm:
          values: |
            tenable:
              # arch doc section 4: credentials via ExternalSecrets, not inline
              # must match ExternalSecret target name in externalsecret.yaml
              existingSecret: tenable-credentials
              scrapeInterval: {{scrapeInterval}}
              filterProviders: {{filterProviders}}
            resources:
              # arch doc section 6: sizing based on ~2000 assets
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                # no CPU limit — see architecture.md section 6
      destination:
        server: 'https://{{cluster}}.k8s.internal:6443'
        # arch doc section 5: monitoring namespace — must already exist (owned by kube-prometheus-stack)
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # arch doc section 5: do not create or own the monitoring namespace
          - CreateNamespace=false
