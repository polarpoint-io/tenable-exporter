# ExternalSecret — Tenable API credentials
#
# Architecture rationale: docs/architecture.md section 4
# PRD constraint: zero Tenable credentials stored in Git or Helm values
#
# This manifest must be deployed to the monitoring namespace on each target cluster
# before the ApplicationSet syncs. The ApplicationSet references the resulting
# Kubernetes Secret via tenable.existingSecret=tenable-credentials.
#
# Vault path: platform/tenable
# Keys: access_key, secret_key
# Permissions required: read-only (Can View assets, vulnerabilities, scans)
#
# To deploy:
#   kubectl apply -f externalsecret.yaml -n monitoring
# Or manage via your GitOps repo alongside the ApplicationSet.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenable-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tenable-exporter
    app.kubernetes.io/component: credentials
spec:
  # arch doc section 4: 1h refresh — security team handles rotation in Vault
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore backed by Vault — must exist on target cluster
    name: vault-backend
    kind: ClusterSecretStore
  target:
    # this name must match tenable.existingSecret in the ApplicationSet Helm values
    name: tenable-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: platform/tenable
        property: access_key
    - secretKey: secret-key
      remoteRef:
        key: platform/tenable
        property: secret_key
